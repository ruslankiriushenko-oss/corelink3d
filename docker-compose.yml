version: '3.9'

services:
  corelink3d:
    build: .
    container_name: corelink3d
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT:          "3000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads_data:
