version: '3.9'

services:
  corelink3d:
    build: .
    container_name: corelink3d
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT:          "3000"
      AI_BACKEND:    "${AI_BACKEND:-ollama}"
      OLLAMA_URL:    "http://ollama:11434"
      OLLAMA_MODEL:  "${OLLAMA_MODEL:-qwen2.5-coder:7b}"
      VLLM_URL:      "${VLLM_URL:-http://vllm:8000}"
      VLLM_MODEL:    "${VLLM_MODEL:-Qwen/Qwen2.5-Coder-7B-Instruct}"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Optional: vLLM service (GPU recommended)
  # Uncomment if you want to run vLLM alongside Ollama.
  #
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   container_name: vllm
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   command:
  #     - "--model"
  #     - "${VLLM_MODEL:-Qwen/Qwen2.5-Coder-7B-Instruct}"
  #     - "--host"
  #     - "0.0.0.0"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   volumes:
  #     - vllm_models:/root/.cache/huggingface

volumes:
  uploads_data:
  ollama_data:
  # vllm_models:
